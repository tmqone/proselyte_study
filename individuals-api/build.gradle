plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'org.openapi.generator' version "${openApiGeneratorVersion}"
}

apply plugin: 'org.openapi.generator'

group = 'com.tmq'
version = '1.0.0'
description = 'REST API для регистрации, логина, обновления токена и получения информации о пользователе через Keycloak.'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webclient'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// LOKI
	implementation 'com.github.loki4j:loki-logback-appender:2.0.3'

	// OPEN API
	implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
	implementation "io.swagger.core.v3:swagger-models:${swaggerModelsVersion}"
	implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
	implementation "org.openapitools:jackson-databind-nullable:${jacksonDatabindNullableVersion}"
	compileOnly "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
}

openApiGenerate {
	generatorName.set("spring")
	inputSpec.set("$projectDir/openapi/individuals-api.yaml")
	outputDir.set("$buildDir/generated/openapi")
	apiPackage.set("com.tmq.individuals_api.api")
	modelPackage.set("com.tmq.individuals_api.dto")
	configOptions = [useSpringBoot4: "true",
					"interfaceOnly": "true"]
}

compileJava.dependsOn('openApiGenerate')

tasks.named('processResources') {
	dependsOn 'openApiGenerate'
}

tasks.named('processTestResources'){
	dependsOn 'openApiGenerate'
}

sourceSets {
	main {
		java.srcDir("$buildDir/generated/openapi/src/main/java")
		resources.srcDir("$buildDir/generated/openapi/src/main/resources")
	}

	test {
		java.srcDir("$buildDir/generated/openapi/src/test/java")
		resources.srcDir("$buildDir/generated/openapi/src/test/resources")
	}
}
