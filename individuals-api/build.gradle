plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'org.openapi.generator' version "${openApiGeneratorVersion}"
}

apply plugin: 'org.openapi.generator'

group = 'com.tmq'
version = '1.0.0'
description = 'REST API для регистрации, логина, обновления токена и получения информации о пользователе через Keycloak.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$projectDir/openapi/individuals-api.yaml")
    outputDir.set("$buildDir/generated/openapi")
    apiPackage.set("com.tmq.individuals.api")
    modelPackage.set("com.tmq.individuals.dto")
    configOptions = [
            "useSpringBoot4"      : "true",
            "useBeanValidation"   : "true",
            "openApiNullable"     : "true",
            "interfaceOnly"       : "true",
            "skipDefaultInterface": "true",
            "reactive"            : "true"]
}

sourceSets {
    main {
        java.srcDir("$buildDir/generated/openapi/src/main/java")
        resources.srcDir("$buildDir/generated/openapi/src/main/resources")
    }

    test {
        java.srcDir("$buildDir/generated/openapi/src/test/java")
        resources.srcDir("$buildDir/generated/openapi/src/test/resources")
    }
}

tasks.named('processResources') {
    dependsOn('openApiGenerate')
}

tasks.named('processTestResources') {
    dependsOn('openApiGenerate')
}

tasks.named('compileJava') {
    dependsOn('openApiGenerate')
}

repositories {
    mavenCentral()
    maven {
        def nexusHost = System.getenv("NEXUS_URL") ?: "http://localhost:9081"
        url = "${nexusHost}/repository/maven-public/"
        def nexusUsername = System.getenv("NEXUS_USERNAME") ?: "admin"
        def nexusPassword = System.getenv("NEXUS_PASSWORD") ?: "admin"
        allowInsecureProtocol = true
        credentials {
            username = nexusUsername
            password = nexusPassword
        }
    }
}



dependencies {
    implementation 'com.tmq:person-service:1.0.0'

    //spring web + data
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    //observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.25.0-alpha'
    implementation 'io.micrometer:context-propagation:1.2.1'
    implementation 'io.github.openfeign:feign-micrometer'

    //aop
    implementation 'org.springframework.boot:spring-boot-starter-aop:4.0.0-M2' //TODO вынести версии

    //reactor micrometer bridge
    implementation 'io.projectreactor:reactor-core-micrometer'

    //helpers
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //test
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // open api
    implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
    implementation "io.swagger.core.v3:swagger-models:${swaggerModelsVersion}"
    implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
    implementation "org.openapitools:jackson-databind-nullable:${jacksonDatabindNullableVersion}"
    compileOnly "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
