spring:
  application:
    name: individuals-api

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: individuals-api
            client-secret: HcZuPeZ0H3sLFxjY2tEDq3lrcpY7tLoW
            client-name: individuals-api
            authorization-grant-type: authorization_code
