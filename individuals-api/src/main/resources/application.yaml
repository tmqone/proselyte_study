spring:
  application:
    name: individuals-api
  main:
    web-application-type: reactive

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-name: ${KEYCLOAK_CLIENT_NAME}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/payment-system
            token-uri: ${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/payment-system/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/payment-system

server:
  port: ${SERVER_PORT}

keycloak:
  url: ${KEYCLOAK_HOST}
  port: ${KEYCLOAK_PORT}

persons:
  name: persons
  url: ${PERSON_SERVICE_HOST}

management:
  otlp:
    metrics:
      export:
        url: ${ALLOY_OTLP_METRICS_URL}
  opentelemetry:
    logging:
      export:
        otlp:
          transport: grpc
          endpoint: ${ALLOY_OTLP_URL}
    tracing:
      export:
        otlp:
          transport: grpc
          endpoint: ${ALLOY_OTLP_URL}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0