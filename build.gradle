buildscript {
	dependencies {
		classpath "org.flywaydb:flyway-database-postgresql:$flywayDbVersion"
		classpath "org.postgresql:postgresql:$postgreSqlVersion"
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version "$springBootVersion"
	id 'io.spring.dependency-management' version "$springDependencyManagement"
	id("org.flywaydb.flyway") version "12.0.0"
}


flyway {
	url = "jdbc:postgresql://localhost:5432/app"
	password = "app"
	user = "app"
	cleanDisabled = false;
}

group = 'com.tmq'
version = '1.0.0'
description = 'module-2.5'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.session:spring-session-core'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:$webFluxOpenApiVersion"
    implementation "org.springdoc:springdoc-openapi-starter-webflux-api:$webFluxOpenApiVersion"

	implementation "org.postgresql:r2dbc-postgresql:$r2dbc_postgresql"
	implementation "org.postgresql:postgresql:$postgreSqlVersion"

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework:spring-jdbc'
	runtimeOnly "org.flywaydb:flyway-database-postgresql:$flywayDbVersion"

	implementation "org.mapstruct:mapstruct:$mapStructVersion"
	implementation "io.jsonwebtoken:jjwt:$jsonWebTokenVersion"
	implementation "javax.xml.bind:jaxb-api:$jaxbApiVersion"
	implementation "org.projectlombok:lombok:$lombokVersion"
	implementation "software.amazon.awssdk:s3:$amazonSdkVersion"
	implementation "software.amazon.awssdk:netty-nio-client:$amazonSdkVersion"
	implementation 'org.springframework.boot:spring-boot-webtestclient'

	compileOnly('org.projectlombok:lombok')
	annotationProcessor "org.projectlombok:lombok"
	annotationProcessor "org.mapstruct:mapstruct-processor:$mapStructVersion"


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'

    testImplementation "org.testcontainers:postgresql:$testContainersVersion"
    testImplementation "org.testcontainers:junit-jupiter:$testContainersVersion"
}

tasks.named('test') {
	useJUnitPlatform()
}
