            Access-Control-Allow-Methods:
              schema:
                deprecated: false
            Access-Control-Allow-Headers:
              schema:
                deprecated: false
            Content-Length:
              schema:
                deprecated: false
            Date:
              schema:
                deprecated: false
            Keep-Alive:
              schema:
                deprecated: false
            Connection:
              schema:
                deprecated: false
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
                    role:
                      type: string
        '401':
          description: Пользователь не авторизован
          headers:
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '403':
          description: У пользователя нет доступа
          headers:
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '404':
          description: Пользователь не найден
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            deprecated: false
      description: >-
        Получение информации о всех пользователях системы. Метод может вернуть
        информацию по определенному пользователю, если в запросе указан параметр
        "id".
    post:
      summary: Создать пользователя
      tags:
        - Административное взаимодействие с пользователями
      responses:
        '200':
          description: Пользователь создан
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '400':
          description: Некорректное тело запроса
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '401':
          description: Пользователь не авторизован
          headers:
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '403':
          description: У пользователя нет доступа
          headers:
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
        '409':
          description: Пользователь с таким именем уже существует
          headers:
            Access-Control-Allow-Origin:
              schema:
