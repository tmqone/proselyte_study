            Access-Control-Allow-Methods:
              schema:
                deprecated: false
            Access-Control-Allow-Headers:
              schema:
                deprecated: false
            Content-Length:
              schema:
                deprecated: false
            Date:
              schema:
                deprecated: false
            Keep-Alive:
              schema:
                deprecated: false
            Connection:
              schema:
                deprecated: false
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: utc-millisec
                role:
                  type: string
      description: Создание пользователя
    put:
      summary: Изменить информацию о пользователе
      tags:
        - Административное взаимодействие с пользователями
      responses:
        '200':
          description: Информация о пользователя изменена
