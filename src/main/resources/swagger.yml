            Access-Control-Allow-Headers:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Date:
              schema:
                type: string
            Keep-Alive:
              schema:
                type: string
            Connection:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
