# Minimal Prometheus config.
# Actual scraping is handled by Alloy via remote_write.
# This file is kept so Prometheus starts cleanly.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]