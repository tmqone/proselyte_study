server:
  port: 0

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          transport: grpc
          endpoint: http://localhost:4317
    logging:
      export:
        otlp:
          endpoint: http://localhost:4317
          transport: grpc
  tracing:
    sampling:
      probability: 0.0

spring:
  jpa:
    hibernate:
      ddl-auto: update