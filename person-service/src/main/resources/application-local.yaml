spring:
  application:
    name: person-api
  datasource:
    url: jdbc:postgresql://localhost:5435/person
    username: person
    password: person
    hikari:
      schema: person

  flyway:
    url: jdbc:postgresql://localhost:5435/person
    user: person
    password: person
    default-schema: person
    create-schemas: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8091

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 5s
  opentelemetry:
    tracing:
      export:
        otlp:
          transport: grpc
          endpoint: http://localhost:4317
    logging:
      export:
        otlp:
          transport: grpc
          endpoint: http://localhost:4317