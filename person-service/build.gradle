buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.flywaydb:flyway-database-postgresql:12.0.3")
    }
}

plugins {
    id "java"
    id "org.flywaydb.flyway" version "12.0.3"
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}"
    id "org.openapi.generator" version "${openApiGeneratorVersion}"
    id "maven-publish"
}

group = "com.tmq"
version = "1.0.0"
description = "person-service"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // com.tmq
    implementation "com.tmq:common:1.0.0"

    //spring web + data
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.flywaydb:flyway-database-postgresql"
    implementation "org.hibernate.orm:hibernate-envers:7.2.5.Final"
    runtimeOnly "org.postgresql:postgresql"

    //observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop:4.0.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.25.0-alpha'
    implementation 'io.github.openfeign:feign-micrometer'

    //helpers
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    //test
    testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-grafana"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testImplementation "org.springframework.boot:spring-boot-resttestclient"
    runtimeOnly "org.springframework.boot:spring-boot-restclient"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // open api
    implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
}

flyway {
    url = "jdbc:postgresql://localhost:5434/person"
    user = "person"
    password = "person"
    defaultSchema = "person"
    cleanDisabled = false
}



publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "nexus"
            def nexusHost = project.findProperty("nexusHost") ?: "http://localhost:9081"
            url = version.endsWith("SNAPSHOT")
                    ? "${nexusHost}/repository/maven-snapshots/"
                    : "${nexusHost}/repository/maven-releases/"
            allowInsecureProtocol = true
            credentials {
                username = project.findProperty("nexusUsername") ?: "admin"
                password = project.findProperty("nexusPassword") ?: "admin"
            }
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

