spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5436/transaction
    username: transaction
    password: transaction
    hikari:
      schema: transaction

    flyway:
      url: jdbc:postgresql://localhost:5436/transaction
      user: transaction
      password: transaction
      default-schema: transaction
      create-schemas: true
      baseline-on-migrate: true

    jpa:
      hibernate:
        ddl-auto: update

  server:
    port: 8091

  management:
    tracing:
      sampling:
        probability: 1.0
    otlp:
      metrics:
        export:
          url: http://localhost:4318/v1/metrics
          step: 5s
    opentelemetry:
      tracing:
        export:
          otlp:
            transport: grpc
            endpoint: http://localhost:4317
      logging:
        export:
          otlp:
            transport: grpc
            endpoint: http://localhost:4317