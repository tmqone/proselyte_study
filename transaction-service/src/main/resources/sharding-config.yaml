dataSources:
  shard-1:
    dataSourceClassName: com.zaxxer.hikari.Datasource
    jdbcUrl: jdbc:postgresql://localhost:5436/transaction
    username: transaction
    password: transaction

  shard-2:
    dataSourceClassName: com.zaxxer.hikari.Datasource
    jdbcUrl: jdbc:postgresql://localhost:5437/transaction
    username: transaction
    password: transaction

rules:
  - !SHARDING
    tables:
      wallets:
        actualDataNodes: shard-${0..1}.wallets
        tableStrategy:
          standard:
            shardingColumn: uid
            shardingAlgorithmName: t-order-inline
        keyGenerateStrategy:
          column: uid
          keyGeneratorName: snowflake
      wallet_types:
        actualDataNodes: shard-${0..1}.wallet_types
        tableStrategy:
          standard:
            shardingColumn: uid
            shardingAlgorithmName: t_order-item-inline
        keyGenerateStrategy:
          column: uid
          keyGeneratorName: snowflake
      transactions:
        actualDataNodes: ds_${0..1}.t_account_${0..1}
        tableStrategy:
          standard:
            shardingAlgorithmName: t-account-inline
        keyGenerateStrategy:
          column: uid
          keyGeneratorName: snowflake
    defaultShardingColumn: uid

    shardingAlgorithms:
      database-inline:
        type: INLINE
        props:
          algorithm-expression: ds_${user_id % 2}
      t-order-inline:
        type: INLINE
        props:
          algorithm-expression: t_order_${order_id % 2}
      t_order-item-inline:
        type: INLINE
        props:
          algorithm-expression: t_order_item_${order_id % 2}
      t-account-inline:
        type: INLINE
        props:
          algorithm-expression: t_account_${account_id % 2}
    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: false